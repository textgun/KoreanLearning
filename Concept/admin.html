<!-- 기존 관리자 계정으로 강사 신청을 조회하고 승인·보류·반려하는 화면. -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>강사 신청 관리 · 말이음</title><link rel="stylesheet" href="teacher-landing.css"><link rel="stylesheet" href="apply.css"><link rel="stylesheet" href="admin.css"></head>
<body><header class="header wrap"><a class="brand" href="./"><span class="brand-icon">ㅁ</span> 말이음</a><a href="../" class="text-link">학습 도구 열기 ↗</a></header>
<main class="wrap"><p class="eyebrow">TEACHER APPLICATIONS</p><h1 style="font-size:36px">새로운 선생님을 만나요.</h1><p class="intro">한국어 설명 능력과 자기소개를 검토한 뒤 결과와 사유를 남겨 주세요.<br>만 18세 이상 자기확인 기준이며, 자격증은 필수가 아닙니다.</p>
<form id="admin-login" class="application-card"><h2>관리자 로그인</h2><div class="field"><label for="admin-email">이메일</label><input id="admin-email" type="email" autocomplete="username" required></div><div class="field"><label for="admin-password">비밀번호</label><input id="admin-password" type="password" autocomplete="current-password" required></div><button class="button yellow">로그인</button></form>
<section id="admin-workspace" hidden><div class="account-actions"><label for="status-filter">신청 상태</label><select id="status-filter"><option value="pending">심사 대기</option><option value="hold">보류</option><option value="approved">승인</option><option value="rejected">반려</option></select><button class="button outline" id="refresh-list">새로고침</button></div><div id="application-list"></div><button class="button outline" id="load-more" hidden>다음 신청 더 보기</button></section>
<button class="button outline" id="admin-logout" hidden>로그아웃</button><p id="admin-status" role="status"></p></main>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-functions-compat.js"></script><script src="application-client.js"></script><script src="admin.js"></script></body></html>
